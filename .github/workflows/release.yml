name: Release

on:
    push:
        tags: ["*.*.*"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: Verify release version
              env:
                  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import fs from 'node:fs';
                  const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                  const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
                  const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
                  assert.match(manifest.version, /^\d+\.\d+\.\d+$/);
                  assert.equal(pkg.version, manifest.version);
                  assert.equal(versions[manifest.version], manifest.minAppVersion);
                  if (process.env.RELEASE_TAG) assert.equal(process.env.RELEASE_TAG, manifest.version);
                  NODE
            - run: npm test
            - run: npm run build
            - name: Verify BRAT assets
              run: |
                  test -s dist/main.js
                  test -s dist/manifest.json
                  test -s dist/styles.css
                  cmp manifest.json dist/manifest.json
            - name: Publish release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  VERSION=$(node -p "require('./manifest.json').version")
                  if gh release view "$VERSION"; then
                    gh release upload "$VERSION" dist/main.js dist/manifest.json dist/styles.css --clobber
                  else
                    gh release create "$VERSION" \
                      --target "$GITHUB_SHA" \
                      --title "$VERSION" \
                      --generate-notes \
                      --latest \
                      dist/main.js dist/manifest.json dist/styles.css
                  fi
